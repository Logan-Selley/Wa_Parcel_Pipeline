# Airflow, in its OWN environment and its OWN metadata database.
#
# Two separations that are deliberate:
#
#   1. Airflow never shares a Python environment with dbt. Tasks run the
#      pipeline image as sibling containers via DockerOperator.
#   2. Airflow's metadata lives in its own Postgres, not in the warehouse.
#      Mixing scheduler state into an analytics database makes both harder to
#      reason about and couples their backup/restore stories.
#
# Started separately from the warehouse:  make airflow-up

name: parcel_airflow

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  # PINNED, because airflow.cfg is NOT on a volume -- only dags/ and logs/ are
  # mounted, so the file is regenerated inside the container on every recreate
  # with a fresh random secret_key. That silently invalidates every browser
  # session, and a tab left open across `make airflow-up` renders as a logged-in
  # page with nothing in it rather than redirecting to the login form. Pinning
  # the key makes restarts survivable.
  #
  # From .env (gitignored), not a literal here: a checked-in secret is a bad
  # habit to model even when the instance is localhost-only.
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
  # The DAG passes the warehouse DSN through to each task container.
  WAREHOUSE_HOST: ${WAREHOUSE_HOST}
  WAREHOUSE_PORT: ${WAREHOUSE_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  # Absolute host path, needed because DockerOperator asks the HOST daemon to
  # mount volumes -- a path inside the Airflow container would be meaningless
  # to it. See the DAG header.
  PIPELINE_HOST_ROOT: ${PWD}
  # The host user the export task writes as. The pipeline image has no USER
  # directive, so it runs as root, and a task bind-mounting exports/ wrote
  # root-owned files into a directory git tracks -- after which `make export`
  # on the host could not overwrite its own outputs without sudo. Passing the
  # real uid/gid through makes the container write files their owner can edit.
  PIPELINE_HOST_UID: ${HOST_UID:-1000}
  PIPELINE_HOST_GID: ${HOST_GID:-1000}

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_meta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.10.5
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      <<: *airflow-env
    # NO _PIP_ADDITIONAL_REQUIREMENTS. apache/airflow:2.10.5 already ships
    # apache-airflow-providers-docker 4.0.0, so the image TAG is the pin -- and
    # a better one than a pip pin, because it fixes the entire dependency set
    # rather than one package. Installing at container start would also mean a
    # DAG could break on a morning when nothing in git had changed.
    #
    # 4.0.0 carries both features this DAG depends on: skip_on_exit_code and
    # the string form of auto_remove.

    # 50000 is the image's airflow user. THE GROUP MUST BE 0, not the docker
    # group: /opt/airflow and everything the image creates is owned by root
    # group and made group-writable, which is how the image supports running
    # under an arbitrary UID. Passing the docker gid here instead drops GID 0
    # and airflow cannot write its own logs -- it fails inside `db migrate`,
    # before the scheduler ever starts.
    #
    # Socket access comes from group_add, which is additive: the process gets
    # GID 0 *and* membership in the docker group.
    user: "50000:0"
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      # THE MANIFEST, read-only. The DAG derives its county list from the same
      # vars: block the extractor and dbt read, so adding a county is one
      # manifest edit rather than one edit plus a matching list in the DAG that
      # nothing would catch if it drifted. Read-only because the DAG reads it
      # on every parse and must never be able to write it.
      - ./parcels/dbt_project.yml:/opt/airflow/manifest/dbt_project.yml:ro
      # The host Docker socket: DockerOperator does not run containers inside
      # Airflow, it asks the host daemon to run SIBLINGS. This is the mount
      # that makes that possible, and the reason for the group id above.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    # admin/admin on the UI is deliberate: LAN-only instance, and the UI holds
    # nothing but scheduler state -- the warehouse password lives in .env, not
    # here. Revisit auth before this ever becomes reachable off-host.
    # A LITERAL block (|), not a folded one (>). In a folded scalar YAML only
    # joins lines at the SAME indentation -- more-indented lines keep their
    # newlines. The previous version wrapped the `users create` arguments onto
    # an indented continuation line, so bash received a multi-line script:
    # `users create` ended at the newline without --email/--firstname/--lastname
    # and failed, `|| true` hid it, and the next line tried to run `--email` as
    # a command. `airflow standalone` then created its own admin with a random
    # password that was never printed or written, so the UI was unreachable.
    #
    # Here every line is a complete command and the one wrapped line uses an
    # explicit backslash, so what bash runs is what it reads like.
    command:
      - bash
      - -c
      - |
        airflow db migrate
        # || true so a restart, where the user already exists, is not fatal.
        airflow users create --role Admin --username admin --password admin \
          --email admin@example.com --firstname Admin --lastname User || true
        exec airflow standalone

volumes:
  airflow_meta:

# Join the warehouse's network so task containers can reach it by service name.
networks:
  default:
    name: parcel_pipeline_default
    external: true
