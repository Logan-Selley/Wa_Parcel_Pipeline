# dbt connection for the parcel warehouse. Values come from the process
# environment via env_var() -- dbt does not read .env; the Makefile exports it.
# schema: staging is the default target, and generate_schema_name maps any
# +schema: config to the bare medallion schemas rather than prefixing.
parcels:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: staging             # default target schema
      threads: 4
